<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account - HexStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Register Page Specific Styles */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .auth-container {
      background: var(--bg-primary);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 500px;
      overflow: hidden;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 40px 32px 32px;
      text-align: center;
      color: white;
    }

    .auth-header .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .auth-header .auth-logo i {
      font-size: 32px;
      animation: float 3s ease-in-out infinite;
    }

    .auth-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .auth-header p {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }

    .auth-body {
      padding: 32px;
      max-height: calc(100vh - 200px);
      overflow-y: auto;
    }

    .auth-body::-webkit-scrollbar {
      width: 6px;
    }

    .auth-body::-webkit-scrollbar-track {
      background: var(--bg-secondary);
    }

    .auth-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .user-type-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .user-type-option {
      cursor: pointer;
    }

    .user-type-option input {
      display: none;
    }

    .user-type-card {
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 10px;
      text-align: center;
      transition: var(--transition);
      background: var(--bg-secondary);
    }

    .user-type-option input:checked + .user-type-card {
      border-color: var(--primary);
      background: rgba(15, 111, 255, 0.05);
    }

    .user-type-option:hover .user-type-card {
      border-color: var(--border-dark);
    }

    .user-type-card i {
      font-size: 24px;
      color: var(--primary);
      margin-bottom: 8px;
      display: block;
    }

    .user-type-card span {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-primary);
      display: block;
    }

    .user-type-card small {
      font-size: 12px;
      color: var(--text-secondary);
    }

    .terms-checkbox {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 20px;
    }

    .terms-checkbox input {
      width: 18px;
      height: 18px;
      margin-top: 2px;
      accent-color: var(--primary);
    }

    .terms-checkbox label {
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    .terms-checkbox label a {
      color: var(--primary);
      text-decoration: none;
    }

    .terms-checkbox label a:hover {
      text-decoration: underline;
    }

    .password-strength {
      margin-top: 8px;
      padding: 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .strength-bar {
      height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin-bottom: 8px;
      overflow: hidden;
    }

    .strength-fill {
      height: 100%;
      width: 0%;
      border-radius: 2px;
      transition: all 0.3s ease;
    }

    .strength-fill.level-weak { background: var(--danger); }
    .strength-fill.level-medium { background: var(--warning); }
    .strength-fill.level-strong { background: var(--success); }

    .strength-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .password-checks {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
      transition: all 0.2s;
    }

    .check-item.passed {
      color: var(--success);
    }

    .check-item i {
      font-size: 10px;
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      gap: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .oauth-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .oauth-btn:hover {
      border-color: var(--border-dark);
      background: var(--bg-secondary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .oauth-btn i {
      font-size: 18px;
    }

    .google-btn:hover {
      border-color: #4285f4;
      color: #4285f4;
    }

    .microsoft-btn:hover {
      border-color: #00a4ef;
      color: #00a4ef;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .auth-footer-links p {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }

    .auth-footer-links a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer-links a:hover {
      text-decoration: underline;
    }

    .back-to-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: var(--transition);
    }

    .back-to-home:hover {
      color: var(--primary);
    }

    .back-to-home i {
      transition: transform 0.3s;
    }

    .back-to-home:hover i {
      transform: translateX(-4px);
    }

    @media (max-width: 480px) {
      .auth-container {
        border-radius: 0;
        max-width: 100%;
      }

      .auth-header {
        padding: 32px 20px 24px;
      }

      .auth-body {
        padding: 24px 20px 32px;
      }

      .form-row {
        grid-template-columns: 1fr;
      }

      .user-type-selector {
        grid-template-columns: 1fr;
      }

      .oauth-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-cube"></i>
          <span>HexStore</span>
        </div>
        <h1>Create Account</h1>
        <p>Join HexStore and start shopping or selling</p>
      </div>

      <!-- Form -->
      <div class="auth-body">
        <form id="register-form" class="auth-form" novalidate>
          <div class="form-row">
            <div class="form-group">
              <label for="username">
                <i class="fas fa-user"></i> Username
              </label>
              <div class="input-icon">
                <i class="fas fa-user"></i>
                <input 
                  type="text" 
                  id="username" 
                  name="username"
                  placeholder="Choose a username" 
                  required 
                  minlength="3"
                  pattern="[a-zA-Z0-9_]+"
                  autocomplete="username"
                >
              </div>
              <small class="form-hint">3+ characters, letters, numbers, underscores</small>
              <span class="form-error" id="username-error"></span>
            </div>

            <div class="form-group">
              <label for="fullname">
                <i class="fas fa-user-circle"></i> Full Name
              </label>
              <div class="input-icon">
                <i class="fas fa-user-circle"></i>
                <input 
                  type="text" 
                  id="fullname" 
                  name="fullname"
                  placeholder="Your full name" 
                  required 
                  autocomplete="name"
                >
              </div>
              <span class="form-error" id="fullname-error"></span>
            </div>
          </div>

          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="Enter your email address" 
                required 
                autocomplete="email"
              >
            </div>
            <span class="form-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <div class="input-icon input-icon-toggle">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="Create a strong password" 
                required 
                minlength="8"
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <!-- Password Strength Indicator -->
            <div class="password-strength" id="password-strength">
              <div class="strength-bar">
                <div class="strength-fill" id="strength-fill"></div>
              </div>
              <div class="strength-text">
                <span id="strength-label">Password strength</span>
              </div>
              <div class="password-checks" id="password-checks">
                <div class="check-item" data-check="minLength">
                  <i class="fas fa-circle"></i>
                  <span>8+ characters</span>
                </div>
                <div class="check-item" data-check="uppercase">
                  <i class="fas fa-circle"></i>
                  <span>Uppercase letter</span>
                </div>
                <div class="check-item" data-check="lowercase">
                  <i class="fas fa-circle"></i>
                  <span>Lowercase letter</span>
                </div>
                <div class="check-item" data-check="number">
                  <i class="fas fa-circle"></i>
                  <span>Number</span>
                </div>
              </div>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>

          <div class="form-group">
            <label for="confirm-password">
              <i class="fas fa-lock"></i> Confirm Password
            </label>
            <div class="input-icon input-icon-toggle">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="confirm-password" 
                name="confirmPassword"
                placeholder="Confirm your password" 
                required 
                autocomplete="new-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <span class="form-error" id="confirm-password-error"></span>
          </div>

          <div class="form-group">
            <label><i class="fas fa-user-tag"></i> I want to:</label>
            <div class="user-type-selector">
              <label class="user-type-option active">
                <input type="radio" name="userType" value="buyer" checked>
                <div class="user-type-card">
                  <i class="fas fa-shopping-bag"></i>
                  <span>Buy</span>
                  <small>Shop products</small>
                </div>
              </label>
              <label class="user-type-option">
                <input type="radio" name="userType" value="seller">
                <div class="user-type-card">
                  <i class="fas fa-store"></i>
                  <span>Sell</span>
                  <small>Sell products</small>
                </div>
              </label>
            </div>
          </div>

          <div class="terms-checkbox">
            <input type="checkbox" id="agree-terms" name="terms" required>
            <label for="agree-terms">
              I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </label>
          </div>

          <button type="submit" class="auth-submit-btn">
            <i class="fas fa-user-plus"></i> Create My Account
          </button>
        </form>

        <div class="divider">
          <span>or sign up with</span>
        </div>

        <div class="oauth-buttons">
          <button class="oauth-btn google-btn" data-provider="google">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </button>
          <button class="oauth-btn microsoft-btn" data-provider="microsoft">
            <i class="fab fa-microsoft"></i>
            <span>Microsoft</span>
          </button>
        </div>

        <div class="auth-footer-links">
          <p>Already have an account? <a href="login.html">Sign in here</a></p>
          <a href="index.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { registerUserFirebase, validateEmail } from './src/firebase.js';
    import { 
      createUserWithEmailAndPassword, 
      updateProfile,
      getAuth 
    } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-auth.js';
    import {
      getFirestore,
      collection,
      addDoc,
      query,
      where,
      getDocs
    } from 'https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js';

    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    // User type selector
    document.querySelectorAll('.user-type-option input').forEach(option => {
      option.addEventListener('change', () => {
        document.querySelectorAll('.user-type-option').forEach(opt => {
          opt.classList.remove('active');
        });
        option.parentElement.classList.add('active');
      });
    });

    // Password strength indicator
    document.getElementById('password').addEventListener('input', (e) => {
      const password = e.target.value;
      const checks = {
        minLength: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /\d/.test(password),
        specialChar: /[!@#$%^&*(),.?":{}|<>]/.test(password)
      };
      
      let score = 0;
      if (checks.minLength) score++;
      if (checks.uppercase) score++;
      if (checks.lowercase) score++;
      if (checks.number) score++;
      if (checks.specialChar) score++;
      if (password.length >= 12) score++;

      const percentage = Math.round((score / 6) * 100);
      const level = score <= 2 ? 'weak' : score <= 4 ? 'medium' : 'strong';

      const fill = document.getElementById('strength-fill');
      const label = document.getElementById('strength-label');

      fill.style.width = percentage + '%';
      fill.className = 'strength-fill level-' + level;
      label.textContent = `Password strength: ${level}`;
      label.className = 'strength-label level-' + level;

      document.querySelectorAll('.check-item').forEach(item => {
        const check = item.dataset.check;
        const icon = item.querySelector('i');
        
        if (checks[check]) {
          icon.classList.replace('fa-circle', 'fa-check-circle');
          item.classList.add('passed');
        } else {
          icon.classList.replace('fa-check-circle', 'fa-circle');
          item.classList.remove('passed');
        }
      });
    });

    // Validation helpers
    function validateUsername(username) {
      return username.length >= 3 && /^[a-zA-Z0-9_]+$/.test(username);
    }

    function validatePassword(password) {
      const hasMinLength = password.length >= 8;
      const hasUppercase = /[A-Z]/.test(password);
      const hasLowercase = /[a-z]/.test(password);
      const hasNumber = /\d/.test(password);
      return { valid: hasMinLength && hasUppercase && hasLowercase && hasNumber };
    }

    // Show error
    function showError(fieldId, errorId, message) {
      const field = document.getElementById(fieldId);
      const error = document.getElementById(errorId);
      
      field.classList.add('error');
      field.parentElement.classList.add('has-error');
      error.textContent = message;
      error.classList.add('visible');
    }

    // Clear errors
    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('visible');
      });
      document.querySelectorAll('input.error').forEach(el => {
        el.classList.remove('error');
        el.parentElement?.classList.remove('has-error');
      });
    }

    // Toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
      };
      
      toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Form submission — real Firebase Auth
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const username = document.getElementById('username').value.trim();
      const fullname = document.getElementById('fullname').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const userType = document.querySelector('input[name="userType"]:checked').value;
      const agreeTerms = document.getElementById('agree-terms').checked;

      let hasError = false;

      if (!validateUsername(username)) {
        showError('username', 'username-error', 'Username must be 3+ characters (letters, numbers, underscores)');
        hasError = true;
      }

      if (!fullname) {
        showError('fullname', 'fullname-error', 'Full name is required');
        hasError = true;
      }

      if (!validateEmail(email)) {
        showError('email', 'email-error', 'Please enter a valid email address');
        hasError = true;
      }

      const passwordValidation = validatePassword(password);
      if (!passwordValidation.valid) {
        showError('password', 'password-error', 'Password must be 8+ chars with uppercase, lowercase and number');
        hasError = true;
      }

      if (password !== confirmPassword) {
        showError('confirm-password', 'confirm-password-error', 'Passwords do not match');
        hasError = true;
      }

      if (!agreeTerms) {
        showToast('Please agree to the Terms of Service and Privacy Policy', 'warning');
        hasError = true;
      }

      if (hasError) return;

      // Show loading
      const submitBtn = e.target.querySelector('.auth-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating account...';

      try {
        // Register via Firebase
        const auth = getAuth();
        const db = getFirestore();
        
        const result = await createUserWithEmailAndPassword(auth, email, password);
        const user = result.user;

        // Update display name
        await updateProfile(user, { displayName: fullname || username });

        // Check if email already in Firestore
        const q = query(collection(db, 'users'), where('email', '==', email));
        const snap = await getDocs(q);
        
        if (snap.empty) {
          // Create user document in Firestore
          await addDoc(collection(db, 'users'), {
            uid: user.uid,
            email: email,
            username: username,
            fullName: fullname,
            userType: userType,
            role: userType,
            provider: 'email',
            createdAt: new Date().toISOString(),
            avatar: null,
            phone: '',
            verified: false,
            settings: {
              notifications: true,
              newsletter: false,
              twoFactor: false
            }
          });
        }

        showToast(`Welcome to HexStore, ${fullname || username}!`, 'success');
        setTimeout(() => {
          // Redirect based on role
          if (userType === 'seller') {
            window.location.href = '/dashboard-app/?role=seller';
          } else {
            window.location.href = '/dashboard-app/?role=buyer';
          }
        }, 1500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-user-plus"></i> Create My Account';
        
        if (err.code === 'auth/email-already-in-use') {
          showError('email', 'email-error', 'An account with this email already exists');
        } else if (err.code === 'auth/weak-password') {
          showError('password', 'password-error', 'Password is too weak. Use 8+ characters.');
        } else if (err.code === 'auth/invalid-email') {
          showError('email', 'email-error', 'Invalid email format');
        } else {
          showToast(err.message || 'Registration failed. Please try again.', 'error');
        }
      }
    });

    // OAuth buttons
    document.querySelectorAll('.oauth-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        showToast('OAuth sign-in coming soon. Use email/password.', 'info');
      });
    });
  </script>
</body>
</html>

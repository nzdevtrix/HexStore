<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - HexStore</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Login Page Specific Styles */
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
    }

    .auth-container {
      background: var(--bg-primary);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 440px;
      overflow: hidden;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
      padding: 40px 32px 32px;
      text-align: center;
      color: white;
    }

    .auth-header .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }

    .auth-header .auth-logo i {
      font-size: 32px;
      animation: float 3s ease-in-out infinite;
    }

    .auth-header h1 {
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 4px;
    }

    .auth-header p {
      font-size: 14px;
      opacity: 0.9;
      margin: 0;
    }

    .auth-body {
      padding: 32px;
    }

    .auth-form {
      margin: 0;
    }

    .auth-footer-links {
      text-align: center;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .auth-footer-links p {
      font-size: 14px;
      color: var(--text-secondary);
      margin: 0;
    }

    .auth-footer-links a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer-links a:hover {
      text-decoration: underline;
    }

    .back-to-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      color: var(--text-secondary);
      text-decoration: none;
      font-size: 14px;
      transition: var(--transition);
    }

    .back-to-home:hover {
      color: var(--primary);
    }

    .back-to-home i {
      transition: transform 0.3s;
    }

    .back-to-home:hover i {
      transform: translateX(-4px);
    }

    .divider {
      display: flex;
      align-items: center;
      margin: 24px 0;
      gap: 12px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span {
      font-size: 12px;
      color: var(--text-tertiary);
      white-space: nowrap;
    }

    .oauth-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
      cursor: pointer;
      transition: var(--transition);
    }

    .oauth-btn:hover {
      border-color: var(--border-dark);
      background: var(--bg-secondary);
      transform: translateY(-1px);
      box-shadow: var(--shadow-sm);
    }

    .oauth-btn i {
      font-size: 18px;
    }

    .google-btn:hover {
      border-color: #4285f4;
      color: #4285f4;
    }

    .microsoft-btn:hover {
      border-color: #00a4ef;
      color: #00a4ef;
    }

    .remember-forgot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .remember-me input {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
    }

    .forgot-password {
      font-size: 13px;
      color: var(--primary);
      text-decoration: none;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .auth-container {
        border-radius: 0;
        max-width: 100%;
      }

      .auth-header {
        padding: 32px 20px 24px;
      }

      .auth-body {
        padding: 24px 20px 32px;
      }

      .oauth-buttons {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-container">
      <!-- Header -->
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-cube"></i>
          <span>HexStore</span>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to continue shopping</p>
      </div>

      <!-- Form -->
      <div class="auth-body">
        <form id="login-form" class="auth-form" novalidate>
          <div class="form-group">
            <label for="email">
              <i class="fas fa-envelope"></i> Email Address
            </label>
            <div class="input-icon">
              <i class="fas fa-envelope"></i>
              <input 
                type="email" 
                id="email" 
                name="email"
                placeholder="Enter your email address" 
                required 
                autocomplete="email"
              >
            </div>
            <span class="form-error" id="email-error"></span>
          </div>

          <div class="form-group">
            <label for="password">
              <i class="fas fa-lock"></i> Password
            </label>
            <div class="input-icon input-icon-toggle">
              <i class="fas fa-lock"></i>
              <input 
                type="password" 
                id="password" 
                name="password"
                placeholder="Enter your password" 
                required 
                autocomplete="current-password"
              >
              <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <span class="form-error" id="password-error"></span>
          </div>

          <div class="remember-forgot">
            <label class="remember-me">
              <input type="checkbox" id="remember" name="remember">
              <span>Remember me</span>
            </label>
            <a href="#" class="forgot-password">Forgot password?</a>
          </div>

          <button type="submit" class="auth-submit-btn">
            <i class="fas fa-sign-in-alt"></i> Sign In
          </button>
        </form>

        <div class="divider">
          <span>or continue with</span>
        </div>

        <div class="oauth-buttons">
          <button class="oauth-btn google-btn" data-provider="google">
            <i class="fab fa-google"></i>
            <span>Google</span>
          </button>
          <button class="oauth-btn microsoft-btn" data-provider="microsoft">
            <i class="fab fa-microsoft"></i>
            <span>Microsoft</span>
          </button>
        </div>

        <div class="auth-footer-links">
          <p>Don't have an account? <a href="register.html">Create one now</a></p>
          <a href="index.html" class="back-to-home">
            <i class="fas fa-arrow-left"></i>
            <span>Back to Home</span>
          </a>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script type="module">
    import { signInUser, getUserDoc, onFirebaseAuthChange, seedDefaultUser, auth } from './src/firebase.js';

    // Toggle password visibility
    document.querySelectorAll('.toggle-password').forEach(btn => {
      btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });

    // Show error
    function showError(fieldId, errorId, message) {
      const field = document.getElementById(fieldId);
      const error = document.getElementById(errorId);
      
      field.classList.add('error');
      field.parentElement.classList.add('has-error');
      error.textContent = message;
      error.classList.add('visible');
    }

    // Clear errors
    function clearErrors() {
      document.querySelectorAll('.form-error').forEach(el => {
        el.textContent = '';
        el.classList.remove('visible');
      });
      document.querySelectorAll('input.error').forEach(el => {
        el.classList.remove('error');
        el.parentElement?.classList.remove('has-error');
      });
    }

    // Toast notification
    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `toast toast-${type}`;
      
      const icons = {
        success: 'fa-check-circle',
        error: 'fa-exclamation-circle',
        warning: 'fa-exclamation-triangle',
        info: 'fa-info-circle'
      };
      
      toast.innerHTML = `<i class="fas ${icons[type]}"></i><span>${message}</span>`;
      container.appendChild(toast);
      
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 4000);
    }

    // Confirm email validation
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Seed default users (John Doe + Admin) on first visit
    seedDefaultUser().catch(() => {});

    // Form submission — real Firebase Auth
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearErrors();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      let hasError = false;

      if (!validateEmail(email)) {
        showError('email', 'email-error', 'Please enter a valid email address');
        hasError = true;
      }

      if (!password) {
        showError('password', 'password-error', 'Password is required');
        hasError = true;
      }

      if (hasError) return;

      // Show loading state
      const submitBtn = e.target.querySelector('.auth-submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

      try {
        // Authenticate via Firebase
        const user = await signInUser(email, password);
        
        // Get user document from Firestore to determine role
        const userDoc = await getUserDoc(user.uid);
        
        showToast(`Welcome back, ${userDoc?.fullName || user.displayName || 'User'}!`, 'success');
        
        // Redirect based on user role
        setTimeout(() => {
          const role = userDoc?.userType || userDoc?.role || 'buyer';
          
          if (role === 'admin') {
            window.location.href = '/dashboard-app/';
          } else if (role === 'seller') {
            window.location.href = '/dashboard-app/?role=seller';
          } else {
            window.location.href = '/dashboard-app/?role=buyer';
          }
        }, 1500);
      } catch (err) {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        
        if (err.code === 'auth/user-not-found') {
          showError('email', 'email-error', 'No account found with this email');
        } else if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
          showError('password', 'password-error', 'Incorrect password');
        } else if (err.code === 'auth/invalid-email') {
          showError('email', 'email-error', 'Invalid email format');
        } else if (err.code === 'auth/too-many-requests') {
          showError('password', 'password-error', 'Too many attempts. Try again later.');
        } else {
          showError('password', 'password-error', err.message || 'Authentication failed');
        }
      }
    });

    // OAuth buttons
    document.querySelectorAll('.oauth-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        showToast('OAuth sign-in coming soon. Use email/password.', 'info');
      });
    });
  </script>
</body>
</html>
